# Scenario A: a single app owns a database. Sugar form on RoleClaim.
---
apiVersion: cnpg.wyvernzora.io/v1alpha1
kind: DatabaseClaim
metadata:
  name: orders
  namespace: app-team-a
spec:
  databaseName: orders
  clusterRef:
    name: shared-pg
    namespace: cnpg-system
  schemas:
    - app
  extensions:
    # schema is required: each extension is installed into "app" so a role
    # whose search_path is pinned there can resolve the extension's operators
    # and functions.
    - name: pgcrypto
      schema: app
    - name: pg_trgm
      schema: app
  deletionPolicy: Retain
---
apiVersion: cnpg.wyvernzora.io/v1alpha1
kind: RoleClaim
metadata:
  name: orders-owner
  namespace: app-team-a
spec:
  databaseClaimRef:
    name: orders
  roleName: orders_owner
  access: Owner
---
apiVersion: cnpg.wyvernzora.io/v1alpha1
kind: RoleClaim
metadata:
  name: orders-rw
  namespace: app-team-a
spec:
  databaseClaimRef:
    name: orders
  roleName: orders_rw
  access: ReadWrite
---
apiVersion: cnpg.wyvernzora.io/v1alpha1
kind: RoleClaim
metadata:
  name: orders-ro
  namespace: app-team-a
spec:
  databaseClaimRef:
    name: orders
  roleName: orders_ro
  access: ReadOnly
